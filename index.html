<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>客户信息表</title>
    <!-- Element Plus CSS -->
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
    <!-- Vue 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <!-- Element Plus JS -->
    <script src="https://unpkg.com/element-plus"></script>
    <!-- Element Plus Icons -->
    <script src="https://unpkg.com/@element-plus/icons-vue"></script>
    <!-- Element Plus 中文语言包 -->
    <script src="https://cdn.jsdelivr.net/npm/element-plus@2.8.8/dist/locale/zh-cn.min.js"></script>
    <!-- XLSX -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <!-- Supabase（备用 unpkg，防止 jsdelivr 在国内加载失败） -->
    <script>
        // 日志小助手，方便排查
        window.__LOG = (tag, ...args) => {
            const t = new Date().toLocaleTimeString();
            console.log(`[${t}] [${tag}]`, ...args);
        };
        window.__LOG('BOOT', '页面脚本开始执行，准备加载 Supabase CDN');
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"
            onerror="window.__SUPABASE_CDN_FAIL=true;console.error('[BOOT] jsdelivr CDN 加载失败，尝试 unpkg 备用');">
    </script>
    <script>
        // jsdelivr 失败则切换 unpkg（使用稳定版 2.45.4）
        if (window.__SUPABASE_CDN_FAIL || (!window.supabase && !window.supabaseJs)) {
            document.write('<script src="https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"><\/script>');
        }
    </script>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 16px;
            background-color: #f5f7fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
            font-size: 14px;
            color: #303133;
        }
        #app { max-width: 1400px; margin: 0 auto; }

        /* ========== 页头 ========== */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .page-title {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 22px;
            font-weight: 600;
            color: #303133;
            margin: 0;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: #606266;
        }
        .user-info .username { font-weight: 600; color: #303133; }

        /* ========== 筛选卡片 ========== */
        .filter-card { margin-bottom: 16px; }
        .filter-row {
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
            align-items: center;
        }
        .filter-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .filter-label {
            font-size: 13px;
            color: #909399;
            font-weight: 600;
        }

        /* ========== 表格卡片 ========== */
        .table-card { margin-bottom: 16px; }
        .table-wrapper {
            width: 100%;
            overflow-x: auto;
        }

        /* 表头/单元格强制不竖排 */
        .cust-table .el-table__header-wrapper th,
        .cust-table .el-table__body-wrapper td {
            text-align: center !important;
        }
        .cust-table .el-table__header-wrapper th .cell,
        .cust-table .el-table__body-wrapper td .cell {
            text-align: center;
            white-space: nowrap;
            word-break: normal;
            line-height: 1.5;
            padding-left: 6px;
            padding-right: 6px;
            text-overflow: ellipsis;
            overflow: hidden;
        }
        /* 国家列居中两行 */
        .cust-table .col-country .cell {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            line-height: 1.4;
            white-space: normal;
        }
        /* 备注列允许换行，左对齐 */
        .cust-table .col-remarks .cell {
            white-space: normal;
            word-break: break-word;
            text-align: left !important;
        }
        .cust-table .el-table__header-wrapper th {
            background-color: #c5d9a8 !important;
            color: #303133 !important;
            font-weight: bold !important;
        }

        /* 国家列状态着色 */
        .country-potential { color: #1E90FF; font-weight: 600; }
        .country-focus { color: #FF0000; font-weight: 600; }
        .country-done { color: #2E8B57; font-weight: 600; }
        .country-default { color: #000; font-weight: 600; }
        .country-code-sub { font-size: 11px; color: #555; font-weight: normal; margin-top: 2px; }

        /* 备注单元格 */
        .remark-cell {
            display: flex;
            flex-direction: column;
            gap: 4px;
            width: 100%;
        }
        .remark-text {
            display: block;
            width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            text-align: left;
            cursor: pointer;
        }
        .remark-text:hover { color: #409eff; }
        .edit-link {
            text-align: right;
        }

        /* ========== 分页 ========== */
        .pagination-wrapper {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 12px 16px;
            border-top: 1px solid #ebeef5;
        }

        /* ========== 操作栏 ========== */
        .action-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }
        .action-bar .left-group,
        .action-bar .right-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .action-bar .right-group { margin-left: auto; }

        /* ========== 登录对话框 ========== */
        .auth-dialog .el-dialog__body { padding-top: 10px; }
        .auth-error {
            color: #f56c6c;
            font-size: 13px;
            text-align: center;
            min-height: 20px;
            margin-bottom: 8px;
        }
        .auth-toggle {
            text-align: center;
            margin-top: 16px;
            font-size: 13px;
            color: #606266;
        }
        .auth-toggle a {
            color: #409eff;
            cursor: pointer;
            text-decoration: none;
            margin-left: 4px;
        }
        .auth-toggle a:hover { text-decoration: underline; }

        /* 筛选 radio-button 状态色 */
        .el-radio-group .rb-primary.is-active { background-color: #1E90FF !important; border-color: #1E90FF !important; box-shadow: -1px 0 0 0 #1E90FF !important; color: #fff !important; }
        .el-radio-group .rb-danger.is-active { background-color: #FF0000 !important; border-color: #FF0000 !important; box-shadow: -1px 0 0 0 #FF0000 !important; color: #fff !important; }
        .el-radio-group .rb-success.is-active { background-color: #2E8B57 !important; border-color: #2E8B57 !important; box-shadow: -1px 0 0 0 #2E8B57 !important; color: #fff !important; }
        .el-radio-group .rb-all.is-active { background-color: #409eff !important; border-color: #409eff !important; box-shadow: -1px 0 0 0 #409eff !important; color: #fff !important; }
        /* radio-button 文字颜色默认深色 */
        .el-radio-button__inner {
            color: #666;
            font-size: 12px;
        }

        /* 隐藏 number 上下箭头 */
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

        /* 移动端点击高亮去除 */
        * { -webkit-tap-highlight-color: transparent; }
        /* 移动端输入框字号>=16px防止iOS自动放大 */
        @media (max-width: 768px) {
            input, select, textarea { font-size: 16px !important; }
        }

        /* ========== 移动端适配 ========== */
        @media (max-width: 768px) {
            html, body {
                padding: 8px !important;
                padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)) !important;
                font-size: 14px;
            }
            #app { min-width: 0; }

            /* 页头 */
            .page-header { flex-direction: column !important; align-items: stretch !important; gap: 10px; }
            .page-title { font-size: 18px !important; flex-wrap: wrap; }
            .user-info { justify-content: space-between; width: 100%; }
            .user-info .el-button { padding: 6px 10px; }

            /* 筛选卡片 */
            .filter-card .el-card__body { padding: 12px; }
            .filter-row { flex-direction: column !important; align-items: stretch !important; gap: 12px; }
            .filter-group { flex-wrap: wrap; gap: 6px; width: 100%; }
            .filter-group:last-child { margin-left: 0 !important; }
            .filter-label { display: inline-block; min-width: 70px; margin-bottom: 4px; }
            .filter-group .el-radio-group {
                display: flex !important;
                flex-wrap: wrap;
                width: 100%;
                gap: 6px;
            }
            .filter-group .el-radio-group .el-radio-button {
                flex: 1 1 auto;
                min-width: 0;
            }
            .filter-group .el-radio-button__inner {
                width: 100%;
                padding: 6px 4px !important;
                font-size: 12px !important;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .filter-group .el-button { width: 100%; min-height: 40px; }

            /* 表格卡片 */
            .table-card .el-card__body { padding: 0 !important; }
            .table-wrapper {
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
                scrollbar-width: none;
            }
            .table-wrapper::-webkit-scrollbar { display: none; }
            .cust-table .el-table__header-wrapper th .cell,
            .cust-table .el-table__body-wrapper td .cell {
                font-size: 12px !important;
                padding-left: 4px !important;
                padding-right: 4px !important;
                line-height: 1.4;
            }
            .country-code-sub { font-size: 10px !important; }
            .remark-cell { gap: 2px; }
            .edit-link .el-button { padding: 2px 4px; font-size: 12px; }

            /* 分页 */
            .pagination-wrapper {
                justify-content: center !important;
                padding: 10px 8px !important;
                flex-wrap: wrap;
                gap: 8px;
            }
            /* 移动端强制隐藏分页的"页大小"和"跳页"区域（不依赖JS判断） */
            .pagination-wrapper .el-pagination .el-pagination__sizes,
            .pagination-wrapper .el-pagination .el-pagination__jump {
                display: none !important;
            }
            .pagination-wrapper .el-pagination {
                flex-wrap: wrap;
                justify-content: center;
                font-size: 12px !important;
            }
            .pagination-wrapper .el-pagination .el-pagination__total {
                font-size: 12px !important;
                flex: 0 0 100%;
                text-align: center;
                margin: 0 0 4px 0 !important;
            }
            .pagination-wrapper .el-pagination .el-pager li {
                min-width: 28px !important;
                height: 28px !important;
                line-height: 28px !important;
                font-size: 12px;
                padding: 0 !important;
            }
            .pagination-wrapper .el-pagination .btn-prev,
            .pagination-wrapper .el-pagination .btn-next {
                min-width: 28px !important;
                height: 28px !important;
                line-height: 28px !important;
                padding: 0 6px !important;
            }

            /* 操作栏 */
            .action-bar { flex-direction: column !important; align-items: stretch !important; gap: 8px; }
            .action-bar .left-group,
            .action-bar .right-group {
                width: 100% !important;
                margin-left: 0 !important;
                flex-direction: column !important;
                gap: 8px;
            }
            .action-bar .el-button {
                width: 100% !important;
                min-height: 42px;
                font-size: 15px;
                margin-left: 0 !important;
            }
            .action-bar .el-button .el-icon { margin-right: 4px; }
            /* el-upload 外层占满宽度 */
            .action-bar .el-upload {
                display: block !important;
                width: 100% !important;
            }
            .action-bar .el-upload .el-button {
                width: 100% !important;
            }

            /* 弹窗适配 */
            .auth-dialog, .el-dialog {
                width: 94vw !important;
                max-width: 94vw !important;
                margin: 5vh auto !important;
            }
            .auth-dialog .el-form--large .el-input__inner,
            .auth-dialog .el-form--large .el-input__wrapper {
                font-size: 16px;
            }
            .el-dialog .el-form-item__label {
                width: 70px !important;
                font-size: 14px;
                padding-right: 8px !important;
            }
            .el-dialog .el-dialog__body { padding: 16px 14px; }
            .el-dialog .el-dialog__footer { padding: 10px 14px 16px; }
            .el-dialog .el-button { min-height: 40px; }

            /* 表格loading居中 */
            .cust-table .el-loading-mask { z-index: 10; }
        }

        /* 小屏手机（<=480px）进一步优化 */
        @media (max-width: 480px) {
            .page-title { font-size: 17px !important; }
            .el-radio-button__inner { padding: 5px 6px !important; font-size: 11px !important; }
            .cust-table .el-table__header-wrapper th .cell,
            .cust-table .el-table__body-wrapper td .cell {
                font-size: 11px !important;
            }
        }
    </style>
</head>
<body>
    <div id="app" v-loading.fullscreen.lock="fullscreenLoading" element-loading-text="正在从云端加载数据...">

        <!-- ========== 登录 ========== -->
        <el-dialog
            v-model="authDialogVisible"
            title="登录"
            :width="isMobile ? '94vw' : '380px'"
            :close-on-click-modal="false"
            :close-on-press-escape="false"
            :show-close="false"
            class="auth-dialog"
            align-center
        >
            <div class="auth-error">{{ authError }}</div>
            <el-form :model="authForm" label-position="top" size="large">
                <el-form-item>
                    <el-input v-model="authForm.email" placeholder="邮箱" type="email" autocomplete="email"></el-input>
                </el-form-item>
                <el-form-item>
                    <el-input v-model="authForm.password" placeholder="密码（至少6位）" type="password"
                              autocomplete="current-password" show-password></el-input>
                </el-form-item>
                <el-form-item>
                    <el-button type="primary" style="width:100%;" :loading="authLoading" @click="handleAuth">
                        登录
                    </el-button>
                </el-form-item>
            </el-form>
        </el-dialog>

        <!-- ========== 主界面 ========== -->
        <div v-if="currentUser">
            <div class="page-header">
                <h1 class="page-title">
                    客户信息表
                    <el-tag :type="statusTagType" effect="light" round size="small">
                        {{ statusText }}
                    </el-tag>
                </h1>
                <div class="user-info">
                    <el-avatar :size="32" style="background:#409eff;">{{ (displayUsername||'U').charAt(0).toUpperCase() }}</el-avatar>
                    <span>欢迎，<span class="username">{{ displayUsername }}</span></span>
                    <el-button size="small" type="danger" plain @click="handleLogout">退出登录</el-button>
                </div>
            </div>

            <!-- 筛选栏 -->
            <el-card class="filter-card" shadow="never">
                <div class="filter-row">
                    <div class="filter-group">
                        <span class="filter-label">状态筛选：</span>
                        <el-radio-group v-model="currentFilters.status" size="small">
                            <el-radio-button value="all" class="rb-all">全部</el-radio-button>
                            <el-radio-button value="潜在客户" class="rb-primary">☆潜在客户</el-radio-button>
                            <el-radio-button value="重点跟进" class="rb-danger">☆重点跟进</el-radio-button>
                            <el-radio-button value="下单完成" class="rb-success">☆下单完成</el-radio-button>
                        </el-radio-group>
                    </div>
                    <div class="filter-group">
                        <span class="filter-label">来源筛选：</span>
                        <el-select
                            v-model="currentFilters.source"
                            placeholder="选择来源"
                            size="small"
                            style="width: 160px;"
                            filterable
                            clearable
                        >
                            <el-option value="all" label="全部来源"></el-option>
                            <el-option
                                v-for="s in sourceList"
                                :key="s"
                                :label="s"
                                :value="s"
                            ></el-option>
                        </el-select>
                    </div>
                    <div class="filter-group">
                        <span class="filter-label">用户编码：</span>
                        <el-input
                            v-model="currentFilters.userCode"
                            placeholder="输入用户编码"
                            size="small"
                            style="width: 140px;"
                            clearable
                            @keyup.enter="searchUserCode"
                            @clear="searchUserCode"
                        >
                            <template #append>
                                <el-button size="small" @click="searchUserCode">
                                    <el-icon><Search></Search></el-icon>
                                </el-button>
                            </template>
                        </el-input>
                    </div>
                    <div class="filter-group" style="margin-left:auto;">
                        <el-button type="warning" plain @click="openSourceDialog">
                            <el-icon><Setting></Setting></el-icon> 管理来源
                        </el-button>
                        <el-button type="primary" :loading="refreshing" @click="refreshData()">
                            <el-icon><Refresh></Refresh></el-icon> 刷新数据
                        </el-button>
                    </div>
                </div>
            </el-card>

            <!-- 添加/编辑 弹窗 -->
            <el-dialog
                v-model="modalVisible"
                :title="editingId === null ? '添加客户信息' : '修改客户信息'"
                :width="isMobile ? '94vw' : '520px'"
                :close-on-click-modal="false"
                align-center
            >
                <el-form :model="form" label-width="90px" label-position="right">
                    <el-form-item label="用户编码">
                        <el-input v-model="form.userCode" :disabled="true" :placeholder="editingId === null ? '自动生成' : ''"></el-input>
                    </el-form-item>
                    <el-form-item label="国家" required>
                        <div style="display:flex;gap:10px;width:100%;">
                            <el-select
                                v-model="form.country"
                                filterable
                                allow-create
                                default-first-option
                                placeholder="输入或选择国家"
                                style="flex:1;"
                                @change="updateCountryCode"
                            >
                                <el-option v-for="(code, c) in countryData" :key="c" :label="c" :value="c" ></el-option>
                            </el-select>
                            <el-input v-model="form.countryCode" placeholder="区号" readonly style="width:110px;" ></el-input>
                        </div>
                    </el-form-item>
                    <el-form-item label="跟进时间" required>
                        <el-date-picker v-model="form.time" type="date" placeholder="选择日期"
                                        value-format="YYYY-MM-DD" style="width:100%;" ></el-date-picker>
                    </el-form-item>
                    <el-form-item label="公司">
                        <el-input v-model="form.company" placeholder="公司名称" ></el-input>
                    </el-form-item>
                    <el-form-item label="客户名">
                        <el-input v-model="form.clientName" placeholder="客户姓名" ></el-input>
                    </el-form-item>
                    <el-form-item label="联系方式">
                        <el-input v-model="form.phone" placeholder="例如: 13800138000" ></el-input>
                    </el-form-item>
                    <el-form-item label="来源">
                        <el-select v-model="form.source" placeholder="请选择来源" style="width:100%;" clearable>
                            <el-option v-for="s in sourceList" :key="s" :label="s" :value="s" ></el-option>
                        </el-select>
                    </el-form-item>
                    <el-form-item label="当前状态">
                        <el-select v-model="form.status" placeholder="请选择状态" style="width:100%;">
                            <el-option label="☆潜在客户" value="潜在客户" ></el-option>
                            <el-option label="☆重点跟进" value="重点跟进" ></el-option>
                            <el-option label="☆下单完成" value="下单完成" ></el-option>
                        </el-select>
                    </el-form-item>
                    <el-form-item label="下单">
                        <el-checkbox v-model="form.isOrdered">已下单</el-checkbox>
                    </el-form-item>
                    <el-form-item label="备注">
                        <el-input v-model="form.remarks" type="textarea" :rows="2" placeholder="备注信息" ></el-input>
                    </el-form-item>
                </el-form>
                <template #footer>
                    <el-button @click="modalVisible = false">取消</el-button>
                    <el-button type="primary" :loading="submitLoading" @click="submitAddData">
                        {{ editingId === null ? '确认添加' : '保存修改' }}
                    </el-button>
                </template>
            </el-dialog>

            <!-- 来源选项管理弹窗 -->
            <el-dialog
                v-model="sourceDialogVisible"
                title="来源选项管理"
                :width="isMobile ? '94vw' : '480px'"
                :close-on-click-modal="false"
                align-center
            >
                <div style="margin-bottom:12px;display:flex;gap:10px;align-items:center;">
                    <el-button type="success" @click="openSourceForm()">
                        <el-icon><Plus></Plus></el-icon> 添加来源
                    </el-button>
                    <span style="font-size:12px;color:#909399;">共 {{ sourceOptions.length }} 个来源选项</span>
                </div>
                <el-table
                    v-loading="sourceLoading"
                    :data="sourceOptions"
                    stripe
                    border
                    size="small"
                    style="width:100%;"
                    empty-text="暂无来源选项"
                >
                    <el-table-column type="index" label="序号" width="60" align="center"></el-table-column>
                    <el-table-column label="来源名称" prop="name" align="center">
                        <template #default="{ row }">
                            {{ row.name }}
                            <el-tag v-if="row.isGlobal" size="small" type="warning" effect="plain" style="margin-left:4px;">全局</el-tag>
                        </template>
                    </el-table-column>
                    <el-table-column label="操作" width="140" align="center">
                        <template #default="{ row }">
                            <el-button link type="primary" size="small" :disabled="row.isGlobal" @click="openSourceForm(row)">
                                <el-icon><Edit></Edit></el-icon> 编辑
                            </el-button>
                            <el-button link type="danger" size="small" :disabled="row.isGlobal" @click="deleteSourceOption(row)">
                                <el-icon><Delete></Delete></el-icon> 删除
                            </el-button>
                        </template>
                    </el-table-column>
                </el-table>
                <template #footer>
                    <el-button @click="sourceDialogVisible = false">关闭</el-button>
                </template>
            </el-dialog>

            <!-- 来源添加/编辑弹窗 -->
            <el-dialog
                v-model="sourceFormVisible"
                :title="sourceEditingId === null ? '添加来源' : '编辑来源'"
                :width="isMobile ? '94vw' : '360px'"
                :close-on-click-modal="false"
                append-to-body
                align-center
            >
                <el-form label-width="80px" label-position="right">
                    <el-form-item label="来源名称">
                        <el-input v-model="sourceFormName" placeholder="请输入来源名称" maxlength="30" show-word-limit></el-input>
                    </el-form-item>
                </el-form>
                <template #footer>
                    <el-button @click="sourceFormVisible = false">取消</el-button>
                    <el-button type="primary" :loading="sourceLoading" @click="submitSourceForm">
                        {{ sourceEditingId === null ? '确认添加' : '保存修改' }}
                    </el-button>
                </template>
            </el-dialog>

            <!-- 表格 -->
            <el-card class="table-card" shadow="never" body-style="padding:0;">
                <div class="table-wrapper">
                    <el-table
                        ref="tableRef"
                        class="cust-table"
                        v-loading="loadingPage"
                        :data="pageData"
                        stripe
                        border
                        :size="isMobile ? 'small' : 'default'"
                        style="width: 100%;"
                        empty-text="暂无客户数据"
                        @selection-change="handleSelectionChange"
                    >
                        <!-- 1. 复选框 -->
                        <el-table-column type="selection" :width="isMobile ? 38 : 50" align="center"></el-table-column>
                        <!-- 2. 序号（按当前分页连续编号） -->
                        <el-table-column type="index" label="序号" :width="isMobile ? 44 : 60" align="center" header-align="center" :index="indexMethod"></el-table-column>
                        <!-- 3. 用户编码 -->
                        <el-table-column label="用户编码" prop="userCode" :min-width="isMobile ? 80 : 110" align="center" header-align="center" show-overflow-tooltip>
                            <template #default="{ row }">
                                <span v-if="row.userCode">{{ row.userCode }}</span>
                                <span v-else style="color:#c0c4cc;">-</span>
                            </template>
                        </el-table-column>
                        <!-- 3. 国家 (区号) -->
                        <el-table-column label="国家" prop="country" :min-width="isMobile ? 80 : 110" align="center" class-name="col-country" header-align="center">
                            <template #default="{ row }">
                                <div :class="getCountryClass(row.status)">
                                    {{ row.country }}
                                    <div class="country-code-sub">({{ row.countryCode || '' }})</div>
                                </div>
                            </template>
                        </el-table-column>
                        <!-- 4. 跟进时间 -->
                        <el-table-column label="跟进时间" prop="time" :min-width="isMobile ? 95 : 120" align="center" header-align="center" show-overflow-tooltip></el-table-column>
                        <!-- 5. 公司 -->
                        <el-table-column label="公司" prop="company" :min-width="isMobile ? 100 : 140" align="center" header-align="center" show-overflow-tooltip></el-table-column>
                        <!-- 6. 客户名 -->
                        <el-table-column label="客户名" prop="clientName" :min-width="isMobile ? 80 : 110" align="center" header-align="center" show-overflow-tooltip></el-table-column>
                        <!-- 7. 联系方式 -->
                        <el-table-column label="联系方式" prop="phone" :min-width="isMobile ? 100 : 140" align="center" header-align="center" show-overflow-tooltip></el-table-column>
                        <!-- 8. 来源 -->
                        <el-table-column label="来源" prop="source" :width="isMobile ? 70 : 100" align="center" header-align="center">
                            <template #default="{ row }">
                                <el-tag v-if="row.source" size="small" effect="plain">{{ row.source }}</el-tag>
                                <span v-else style="color:#c0c4cc;">-</span>
                            </template>
                        </el-table-column>
                        <!-- 9. 下单 -->
                        <el-table-column label="下单" prop="ord" :width="isMobile ? 60 : 80" align="center" header-align="center">
                            <template #default="{ row }">
                                <span v-if="row.ord" style="color:#67c23a;">已下单</span>
                                <span v-else style="color:#c0c4cc;">-</span>
                            </template>
                        </el-table-column>
                        <!-- 10. 备注 -->
                        <el-table-column label="备注" prop="remarks" :min-width="isMobile ? 140 : 200" align="left" header-align="center" class-name="col-remarks">
                            <template #default="{ row }">
                                <div class="remark-cell">
                                    <span class="remark-text" @click="showRemarkInfo(row.remarks)">
                                        {{ row.remarks || '' }}
                                    </span>
                                    <div class="edit-link">
                                        <el-button link type="primary" size="small" @click="openModal(row.id)">
                                            <el-icon><Edit></Edit></el-icon> 修改
                                        </el-button>
                                    </div>
                                </div>
                            </template>
                        </el-table-column>
                    </el-table>
                </div>
                <!-- 分页 -->
                <div class="pagination-wrapper" :class="{ 'mobile-pager': isMobile }">
                    <el-pagination
                        v-model:current-page="pagination.currentPage"
                        v-model:page-size="pagination.pageSize"
                        :page-sizes="pageSizes"
                        :total="pagination.total"
                        :page-count="Math.max(1, Math.ceil(pagination.total / pagination.pageSize))"
                        :layout="pagerLayout"
                        :small="isMobile"
                        :pager-count="isMobile ? 5 : 7"
                        background
                        @current-change="handleCurrentChange"
                        @size-change="handleSizeChange"
                    ></el-pagination>
                </div>
            </el-card>

            <!-- 操作栏 -->
            <div class="action-bar">
                <div class="left-group">
                    <el-button type="danger" @click="batchDelete">
                        <el-icon><Delete></Delete></el-icon> 批量删除
                    </el-button>
                    <el-button type="primary" @click="exportExcel">
                        <el-icon><Download></Download></el-icon> 导出Excel
                    </el-button>
                    <el-button type="warning" @click="exportData">
                        <el-icon><Files></Files></el-icon> 备份数据
                    </el-button>
                    <el-upload
                        :show-file-list="false"
                        accept=".json"
                        :before-upload="importData"
                    >
                        <el-button type="warning" plain>
                            <el-icon><Upload></Upload></el-icon> 恢复数据
                        </el-button>
                    </el-upload>
                </div>
                <div class="right-group">
                    <el-button type="success" size="large" @click="openModal()">
                        <el-icon><Plus></Plus></el-icon> 添加数据
                    </el-button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, reactive, computed, watch, onMounted, nextTick, onBeforeUnmount } = Vue;
        const { ElMessage, ElMessageBox } = ElementPlus;

        const app = createApp({
            setup() {
                // ========== Supabase 配置 ==========
                const SUPABASE_URL = 'https://nskqjukbkeznpserxilm.supabase.co';
                const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5za3FqdWtia2V6bnBzZXJ4aWxtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5OTU1MjYsImV4cCI6MjEwMjU3MTUyNn0.1f_1gPJPtu1V-XXBpis3afmn7TxevYKbGbBT2htRCpE';
                const TABLE_NAME = 'client_info';

                let supabase = null;
                let authListener = null;
                const bootReady = ref(false);     // 启动流程完成前，onAuthStateChange 不主动发查询
                let authPending = false;          // auth 操作互斥锁，避免与数据查询死锁

                // 超时工具：防止 Promise 永久 pending
                const withTimeout = (promise, ms, label) => {
                    return new Promise((resolve, reject) => {
                        const timer = setTimeout(() => {
                            reject(new Error(`[TIMEOUT] ${label} 超时（${ms}ms）`));
                        }, ms);
                        promise.then(
                            (v) => { clearTimeout(timer); resolve(v); },
                            (e) => { clearTimeout(timer); reject(e); }
                        );
                    });
                };
                const LOG = (tag, ...args) => window.__LOG ? window.__LOG(tag, ...args) : console.log(`[${tag}]`, ...args);

                // ========== 国家与区号映射 ==========
                const countryData = {
                    "中国": "+86", "中国台湾": "+886", "中国香港": "+852", "中国澳门": "+853",
                    "美国": "+1", "加拿大": "+1", "英国": "+44", "法国": "+33", "德国": "+49",
                    "意大利": "+39", "西班牙": "+34", "葡萄牙": "+351", "荷兰": "+31", "比利时": "+32",
                    "瑞士": "+41", "瑞典": "+46", "挪威": "+47", "丹麦": "+45", "芬兰": "+358",
                    "俄罗斯": "+7", "乌克兰": "+380", "波兰": "+48", "捷克": "+420", "匈牙利": "+36",
                    "澳大利亚": "+61", "新西兰": "+64", "日本": "+81", "韩国": "+82", "新加坡": "+65",
                    "马来西亚": "+60", "泰国": "+66", "越南": "+84", "菲律宾": "+63", "印度": "+91",
                    "印尼": "+62", "巴基斯坦": "+92", "沙特阿拉伯": "+966", "阿联酋": "+971",
                    "南非": "+27", "埃及": "+20", "尼日利亚": "+234", "肯尼亚": "+254",
                    "巴西": "+55", "墨西哥": "+52", "阿根廷": "+54", "智利": "+56", "哥伦比亚": "+57",
                    "厄瓜多尔": "+593", "秘鲁": "+51", "阿尔及利亚": "+213", "摩洛哥": "+212"
                };
                const SOURCE_TABLE_NAME = 'source_options';
                const sourceList = ref([]);
                const sourceLoading = ref(false);
                const sourceDialogVisible = ref(false);
                const sourceFormVisible = ref(false);
                const sourceEditingId = ref(null);
                const sourceFormName = ref('');
                const sourceOptions = ref([]);

                // ========== 状态 ==========
                const tableRef = ref(null);
                const fullscreenLoading = ref(false);
                const authDialogVisible = ref(false);
                const authLoading = ref(false);
                const authError = ref('');
                const authForm = reactive({ email: '', password: '' });

                const currentUser = ref(null);
                const displayUsername = ref('--');

                const clientData = ref([]);
                const pageData = ref([]);
                const currentFilters = reactive({ status: 'all', source: 'all', userCode: '' });
                // 移动端默认每页 10 条，PC 20 条（用 matchMedia 更可靠）
                const mqMobile = window.matchMedia ? window.matchMedia('(max-width: 768px)') : null;
                const isMobile = ref(mqMobile ? mqMobile.matches : window.innerWidth <= 768);
                const pagination = reactive({
                    currentPage: 1,
                    pageSize: isMobile.value ? 10 : 20,
                    total: 0
                });
                const selectedRows = ref([]);
                const loadingPage = ref(false);
                const pageSizes = isMobile.value ? [10, 20, 50] : [10, 20, 50, 100];

                const modalVisible = ref(false);
                const editingId = ref(null);
                const submitLoading = ref(false);
                const originalStatus = ref(''); // 保存原始状态，用于取消勾选时恢复
                const form = reactive({
                    country: '', countryCode: '', time: '', company: '',
                    clientName: '', userCode: '', phone: '', source: '', status: '重点跟进', remarks: '', isOrdered: false
                });

                const statusText = ref('连接中...');
                const statusTagType = ref('info');

                // ========== 工具方法 ==========
                const getCountryClass = (status) => {
                    if (status === '潜在客户') return 'country-potential';
                    if (status === '重点跟进') return 'country-focus';
                    if (status === '下单完成') return 'country-done';
                    return 'country-default';
                };
                const updateCountryCode = () => {
                    form.countryCode = countryData[form.country] || '';
                };

                // 监听下单checkbox变化
                watch(() => form.isOrdered, (newValue, oldValue) => {
                    if (newValue) {
                        // 勾选时保存当前状态，然后设置为"下单完成"
                        if (form.status !== '下单完成') {
                            originalStatus.value = form.status;
                            form.status = '下单完成';
                        }
                    } else {
                        // 取消勾选时恢复到原始状态
                        if (originalStatus.value) {
                            form.status = originalStatus.value;
                            originalStatus.value = '';
                        }
                    }
                });

                // ========== 来源选项管理 ==========
                const fetchSourceOptions = async () => {
                    if (!supabase || !currentUser.value) return;
                    
                    try {
                        // 使用 .or() 组合查询条件：
                        // 1. is_global 为 true
                        // 2. user_id 等于当前用户ID
                        const { data, error } = await supabase
                            .from(SOURCE_TABLE_NAME)
                            .select('id, name, sort_order') // 建议只选取需要的字段，减少传输量
                            .or(`is_global.eq.true,user_id.eq.${currentUser.value.id}`)
                            .order('sort_order', { ascending: true });

                        if (error) throw error;

                        // 处理数据，标记来源类型
                        const items = (data || []).map(r => ({
                            id: r.id,
                            name: r.name,
                            sortOrder: r.sort_order || 0,
                            // 根据原始数据判断是否为全局，保持逻辑一致性
                            isGlobal: r.is_global === true 
                        }));

                        sourceOptions.value = items;
                        sourceList.value = items.map(o => o.name);
                        
                    } catch (err) {
                        LOG('SOURCE', '加载来源选项失败:', err);
                    }
                };


                const openSourceDialog = async () => {
                    sourceDialogVisible.value = true;
                    sourceFormVisible.value = false;
                    sourceEditingId.value = null;
                    sourceFormName.value = '';
                    await fetchSourceOptions();
                };

                const openSourceForm = (item = null) => {
                    if (item) {
                        sourceEditingId.value = item.id;
                        sourceFormName.value = item.name;
                    } else {
                        sourceEditingId.value = null;
                        sourceFormName.value = '';
                    }
                    sourceFormVisible.value = true;
                };

                const submitSourceForm = async () => {
                    const name = sourceFormName.value.trim();
                    if (!name) { ElMessage.warning('请输入来源名称'); return; }
                    if (!sourceEditingId.value && sourceOptions.value.some(o => o.name === name)) {
                        ElMessage.warning('该来源已存在'); return;
                    }
                    sourceLoading.value = true;
                    try {
                        if (sourceEditingId.value) {
                            const { error } = await supabase
                                .from(SOURCE_TABLE_NAME)
                                .update({ name })
                                .eq('id', sourceEditingId.value);
                            if (error) throw error;
                            ElMessage.success('修改来源成功');
                        } else {
                            const maxSort = sourceOptions.value.length > 0
                                ? Math.max(...sourceOptions.value.map(o => o.sortOrder)) + 1 : 1;
                            const { error } = await supabase
                                .from(SOURCE_TABLE_NAME)
                                .insert([{ user_id: currentUser.value.id, name, sort_order: maxSort, is_global: false }]);
                            if (error) throw error;
                            ElMessage.success('添加来源成功');
                        }
                        sourceFormVisible.value = false;
                        sourceEditingId.value = null;
                        sourceFormName.value = '';
                        await fetchSourceOptions();
                    } catch (err) {
                        ElMessage.error('操作失败: ' + (err.message || err));
                    } finally {
                        sourceLoading.value = false;
                    }
                };

                const deleteSourceOption = async (item) => {
                    try {
                        await ElMessageBox.confirm(
                            `确定要删除来源「${item.name}」吗？`,
                            '删除确认',
                            { confirmButtonText: '确定', cancelButtonText: '取消', type: 'warning' }
                        );
                        sourceLoading.value = true;
                        const { error } = await supabase
                            .from(SOURCE_TABLE_NAME)
                            .delete()
                            .eq('id', item.id);
                        if (error) throw error;
                        ElMessage.success('删除成功');
                        await fetchSourceOptions();
                    } catch (err) {
                        if (err !== 'cancel') ElMessage.error('删除失败: ' + (err.message || err));
                    } finally {
                        sourceLoading.value = false;
                    }
                };

                const setStatus = (type, text) => {
                    statusText.value = text;
                    if (type === 'ready') statusTagType.value = 'success';
                    else if (type === 'error') statusTagType.value = 'danger';
                    else statusTagType.value = 'info';
                };

                const formatDate = (dateStr) => {
                    if (!dateStr) return '';
                    const m = dateStr.match(/^(\d{4})-(\d{2})-(\d{2})$/);
                    if (m) return `${m[1]}年${parseInt(m[2])}月${parseInt(m[3])}日`;
                    return dateStr;
                };
                const parseDateForInput = (dateStr) => {
                    if (!dateStr) return '';
                    const m = dateStr.match(/(\d{4})年(\d{1,2})月(\d{1,2})日/);
                    if (m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
                    return dateStr;
                };

                const mapFromDB = (row) => ({
                    id: row.id,
                    country: row.country || '',
                    countryCode: row.country_code || '',
                    time: row.follow_time || '',
                    company: row.company || '',
                    clientName: row.client_name || '',
                    userCode: row.user_code || '',
                    phone: row.phone || '',
                    source: row.source || '',
                    status: row.status || '潜在客户',
                    ord: row.ord || '',
                    remarks: row.remarks || ''
                });

                // ========== 认证 ==========
                const showAuthPage = () => {
                    authForm.email = ''; authForm.password = '';
                    authError.value = '';
                    authDialogVisible.value = true;
                };
                const hideAuthPage = () => { authDialogVisible.value = false; };

                const applyUser = (user) => {
                    currentUser.value = user;
                    const dn = user?.user_metadata?.display_name || user?.email?.split('@')[0] || '用户';
                    displayUsername.value = dn;
                    hideAuthPage();
                };

                const clearUser = () => {
                    currentUser.value = null;
                    clientData.value = [];
                    pageData.value = [];
                    pagination.total = 0;
                    pagination.currentPage = 1;
                    setStatus('info', '未登录');
                };

                const handleAuth = async () => {
                    const email = authForm.email.trim();
                    const password = authForm.password;
                    const displayName = authForm.displayName.trim();
                    authError.value = '';
                    if (!email || !password) { authError.value = '请填写邮箱和密码'; return; }
                    if (password.length < 6) { authError.value = '密码至少6位'; return; }
                    authLoading.value = true;
                    try {
                        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
                        if (error) throw error;
                    } catch (err) {
                        authError.value = err.message || '操作失败，请重试';
                    } finally {
                        authLoading.value = false;
                    }
                };

                const handleLogout = async () => {
                    try {
                        await ElMessageBox.confirm('确定要退出登录吗？', '提示', {
                            confirmButtonText: '确定退出', cancelButtonText: '取消', type: 'warning'
                        });
                        await supabase.auth.signOut();
                    } catch (e) { /* 取消 */ }
                };

                // 表格重新布局
                const relayoutTable = () => {
                    nextTick(() => {
                        if (tableRef.value) {
                            tableRef.value.doLayout();
                            setTimeout(() => { tableRef.value && tableRef.value.doLayout(); }, 300);
                        }
                    });
                };
                const handleWindowResize = () => {
                    const mobile = mqMobile ? mqMobile.matches : window.innerWidth <= 768;
                    if (mobile !== isMobile.value) {
                        isMobile.value = mobile;
                        // 跨设备切换时调整默认分页条数
                        const newSizes = mobile ? [10, 20, 50] : [10, 20, 50, 100];
                        pageSizes.length = 0;
                        pageSizes.push(...newSizes);
                        if (mobile && pagination.pageSize > 50) {
                            pagination.pageSize = 10;
                        } else if (!mobile && pagination.pageSize > 100) {
                            pagination.pageSize = 20;
                        }
                        nextTick(() => fetchPage());
                    }
                    if (tableRef.value) tableRef.value.doLayout();
                };
                // 使用 matchMedia 监听更可靠
                if (mqMobile) {
                    if (mqMobile.addEventListener) mqMobile.addEventListener('change', handleWindowResize);
                    else if (mqMobile.addListener) mqMobile.addListener(handleWindowResize);
                }
                window.addEventListener('resize', handleWindowResize);

                // ========== 数据加载（服务端分页） ==========
                const buildQuery = () => {
                    let q = supabase.from(TABLE_NAME).select('*', { count: 'exact' })
                        .eq('user_id', currentUser.value.id);
                    if (currentFilters.status !== 'all') q = q.eq('status', currentFilters.status);
                    if (currentFilters.source !== 'all') q = q.eq('source', currentFilters.source);
                    if (currentFilters.userCode) q = q.ilike('user_code', `%${currentFilters.userCode}%`);
                    q = q.order('user_code', { ascending: true });
                    return q;
                };

                const fetchPage = async () => {
                    LOG('FETCH', 'fetchPage 被调用，loadingPage=', loadingPage.value,
                        'supabase=', !!supabase, 'currentUser=', !!currentUser.value,
                        'page=', pagination.currentPage, 'pageSize=', pagination.pageSize,
                        'filters=', { ...currentFilters });
                    if (loadingPage.value) { LOG('FETCH', '正在加载中，跳过重复调用'); return false; }
                    if (!supabase) {
                        LOG('FETCH', 'supabase 尚未初始化，无法拉数据');
                        ElMessage.warning('云端服务尚未初始化，请稍候重试');
                        return false;
                    }
                    if (!currentUser.value) {
                        LOG('FETCH', 'currentUser 为空，弹登录框');
                        ElMessage.warning('请先登录后再加载数据');
                        showAuthPage();
                        return false;
                    }
                    loadingPage.value = true;
                    try {
                        const from = (pagination.currentPage - 1) * pagination.pageSize;
                        const to = from + pagination.pageSize - 1;
                        LOG('FETCH', '发起 supabase 查询 range=', from, '-', to);
                        const { data, error, count } = await withTimeout(
                            buildQuery().range(from, to),
                            15000,
                            `分页查询 page=${pagination.currentPage}`
                        );
                        LOG('FETCH', '查询返回，rows=', (data||[]).length, 'count=', count, 'error=', error);
                        if (error) throw error;
                        pageData.value = (data || []).map(mapFromDB);
                        pagination.total = count || 0;
                        const totalPages = Math.max(1, Math.ceil(pagination.total / pagination.pageSize));
                        if (pagination.currentPage > totalPages) {
                            LOG('FETCH', '当前页超出范围，回退到最后一页 totalPages=', totalPages);
                            pagination.currentPage = totalPages;
                            loadingPage.value = false;
                            return fetchPage();
                        }
                        setStatus('ready', `共 ${pagination.total} 条数据 · 第 ${pagination.currentPage}/${totalPages} 页`);
                        selectedRows.value = [];
                        relayoutTable();
                        LOG('FETCH', '加载成功 pageData 条数=', pageData.value.length);
                        return true;
                    } catch (err) {
                        LOG('FETCH', '加载失败 err=', err);
                        console.error('加载数据失败:', err);
                        setStatus('error', '加载失败');
                        ElMessage.error('加载数据失败: ' + (err?.message || err));
                        return false;
                    } finally {
                        loadingPage.value = false;
                        LOG('FETCH', 'fetchPage 结束，loadingPage=false');
                    }
                };

                const refreshing = ref(false);
                const refreshData = async (silent = false) => {
                    LOG('REFRESH', 'refreshData 被调用 silent=', silent,
                        'supabase=', !!supabase, 'currentUser=', !!currentUser.value);
                    if (!supabase || !currentUser.value) {
                        LOG('REFRESH', '未就绪 supabase/currentUser，跳过');
                        if (!silent) ElMessage.warning('请先登录');
                        fullscreenLoading.value = false;
                        return false;
                    }
                    if (refreshing.value) { LOG('REFRESH', '正在刷新中，跳过重复调用'); return false; }
                    refreshing.value = true;
                    // 首次启动时 silent=true 也显示全屏加载提示
                    if (silent && !fullscreenLoading.value) fullscreenLoading.value = true;
                    try {
                        pagination.currentPage = 1;
                        await fetchSourceOptions();
                        const ok = await fetchPage();
                        if (ok && !silent) ElMessage.success('数据已刷新');
                        LOG('REFRESH', 'refreshData 完成 ok=', ok);
                        return ok;
                    } finally {
                        refreshing.value = false;
                        fullscreenLoading.value = false;
                    }
                };

                const handleSizeChange = (size) => {
                    pagination.pageSize = size;
                    pagination.currentPage = 1;
                    fetchPage();
                    nextTick(() => { tableRef.value && tableRef.value.scrollTo({ top: 0 }); });
                };
                const handleCurrentChange = (page) => {
                    pagination.currentPage = page;
                    fetchPage();
                    nextTick(() => { tableRef.value && tableRef.value.scrollTo({ top: 0 }); });
                };

                // ========== 弹窗表单 ==========
                const resetForm = () => {
                    form.country = ''; form.countryCode = '';
                    form.time = new Date().toISOString().split('T')[0];
                    form.company = ''; form.clientName = ''; form.userCode = ''; form.phone = '';
                    form.source = ''; form.status = '重点跟进'; form.remarks = ''; form.isOrdered = false;
                    originalStatus.value = '';
                };

                const openModal = async (id = null) => {
                    editingId.value = id;
                    if (id !== null) {
                        // 编辑：优先从当前页找，找不到再单条查
                        let item = pageData.value.find(d => d.id === id);
                        if (!item) {
                            try {
                                const { data, error } = await supabase
                                    .from(TABLE_NAME).select('*').eq('id', id).maybeSingle();
                                if (!error && data) item = mapFromDB(data);
                            } catch(e) {}
                        }
                        if (item) {
                            form.country = item.country;
                            form.countryCode = item.countryCode || '';
                            form.time = parseDateForInput(item.time);
                            form.company = item.company;
                            form.clientName = item.clientName;
                            form.userCode = item.userCode || '';
                            form.phone = item.phone || '';
                            form.source = item.source;
                            form.status = item.status;
                            form.remarks = item.remarks;
                            // 根据ord字段判断是否已下单
                            const isOrdered = !!(item.ord && item.ord.trim() !== '');
                            form.isOrdered = isOrdered;
                            // 保存原始状态，用于取消勾选时恢复
                            originalStatus.value = isOrdered ? '' : item.status;
                        }
                    } else {
                        resetForm();
                    }
                    modalVisible.value = true;
                };

                const showRemarkInfo = (text) => {
                    if (text && text.trim() !== '') {
                        ElMessageBox.alert(text, '📝 备注详情', { confirmButtonText: '关闭' });
                    } else {
                        ElMessage.info('暂无备注信息');
                    }
                };

                // 生成下一个用户编码
                const generateUserCode = async () => {
                    const { data, error } = await supabase
                        .from(TABLE_NAME)
                        .select('user_code')
                        .eq('user_id', currentUser.value.id)
                        .order('user_code', { ascending: false })
                        .limit(1);
                    if (error || !data || data.length === 0) return '00001';
                    const lastCode = data[0].user_code;
                    const lastNum = parseInt(lastCode, 10) || 0;
                    return String(lastNum + 1).padStart(5, '0');
                };

                const submitAddData = async () => {
                    if (!form.country || !form.time) {
                        ElMessage.warning('请至少填写【国家】和【跟进时间】！');
                        return;
                    }
                    submitLoading.value = true;
                    fullscreenLoading.value = true;
                    try {
                        const country = form.country.trim();
                        const countryCode = form.countryCode.trim();
                        const time = formatDate(form.time);
                        const company = form.company.trim();
                        const clientName = form.clientName.trim();
                        const phone = form.phone.trim();
                        const source = form.source;
                        const status = form.status;
                        const remarks = form.remarks.trim();

                        if (editingId.value !== null) {
                            const record = { country, country_code: countryCode, follow_time: time, company, client_name: clientName, phone, source, status, remarks, ord: form.isOrdered ? '已下单' : '' };
                            const { error } = await supabase.from(TABLE_NAME).update(record).eq('id', editingId.value);
                            if (error) throw error;
                            ElMessage.success('修改成功！');
                        } else {
                            const userCode = await generateUserCode();
                            const record = { user_id: currentUser.value.id, country, country_code: countryCode, follow_time: time, company, client_name: clientName, user_code: userCode, phone, source, status, ord: form.isOrdered ? '已下单' : '', remarks };
                            const { error } = await supabase.from(TABLE_NAME).insert([record]);
                            if (error) throw error;
                            ElMessage.success('添加成功！');
                        }
                        modalVisible.value = false;
                        // 添加新数据后跳到第 1 页；修改后刷新当前页
                        if (editingId.value !== null) await fetchPage();
                        else await refreshData();
                    } catch (err) {
                        ElMessage.error('保存失败: ' + err.message);
                    } finally {
                        submitLoading.value = false;
                        fullscreenLoading.value = false;
                    }
                };

                // ========== 多选 & 批量删除 ==========
                const handleSelectionChange = (rows) => { selectedRows.value = rows; };
                const batchDelete = async () => {
                    if (selectedRows.value.length === 0) {
                        ElMessage.warning('请先在表格中勾选需要删除的客户行！');
                        return;
                    }
                    try {
                        await ElMessageBox.confirm(
                            `确定要删除选中的 ${selectedRows.value.length} 条客户数据吗？此操作不可撤销！`,
                            '批量删除确认', { confirmButtonText: '确定删除', cancelButtonText: '取消', type: 'warning' }
                        );
                        fullscreenLoading.value = true;
                        const ids = selectedRows.value.map(r => r.id);
                        const { error } = await supabase.from(TABLE_NAME).delete().in('id', ids);
                        if (error) throw error;
                        ElMessage.success(`成功删除 ${ids.length} 条数据`);
                        // 删完若当前页空且不是首页，回退一页；否则刷新当前页
                        const restOnPage = pageData.value.filter(item => !ids.includes(item.id)).length;
                        if (restOnPage === 0 && pagination.currentPage > 1) {
                            pagination.currentPage -= 1;
                        }
                        await fetchPage();
                    } catch (err) {
                        if (err !== 'cancel') ElMessage.error('删除失败: ' + (err.message || err));
                    } finally {
                        fullscreenLoading.value = false;
                    }
                };

                // ========== 筛选（切换时回到第一页） ==========
                // 状态、来源：实时过滤
                watch(() => [currentFilters.status, currentFilters.source], () => {
                    pagination.currentPage = 1;
                    fetchPage();
                });
                // 用户编码：仅手动触发（回车 / 搜索按钮 / 清空按钮）
                const searchUserCode = () => {
                    pagination.currentPage = 1;
                    fetchPage();
                };

                // 序号列（跨页连续）
                const indexMethod = (index) => {
                    return (pagination.currentPage - 1) * pagination.pageSize + index + 1;
                };

                // 分页布局：统一使用 sizes, prev, pager, next（用户要求精简版），不分端差异
                const pagerLayout = computed(() => 'sizes, prev, pager, next');

                // ========== 导出导入 ==========
                const fetchAll = async (applyFilters = false) => {
                    let q = supabase.from(TABLE_NAME).select('*').eq('user_id', currentUser.value.id);
                    if (applyFilters) {
                        if (currentFilters.status !== 'all') q = q.eq('status', currentFilters.status);
                        if (currentFilters.source !== 'all') q = q.eq('source', currentFilters.source);
                        if (currentFilters.userCode) q = q.ilike('user_code', `%${currentFilters.userCode}%`);
                    }
                    q = q.order('user_code', { ascending: true });
                    const { data, error } = await q;
                    if (error) throw error;
                    return (data || []).map(mapFromDB);
                };

                const exportExcel = async () => {
                    if (pagination.total === 0) { ElMessage.warning('当前没有数据可以导出！'); return; }
                    fullscreenLoading.value = true;
                    try {
                        const all = await fetchAll(true);
                        if (all.length === 0) { ElMessage.warning('当前筛选条件下没有数据！'); return; }
                        const excelRows = [["序号","国家","区号","跟进时间","公司","客户名","用户编码","联系方式","来源","状态","下单","备注"]];
                        all.forEach((item, index) => {
                            excelRows.push([index+1, item.country, item.countryCode||'', item.time, item.company, item.clientName, item.user_code||'', item.phone||'', item.source||'', item.status, item.ord||'', item.remarks]);
                        });
                        const wb = XLSX.utils.book_new();
                        const ws = XLSX.utils.aoa_to_sheet(excelRows);
                        ws['!cols'] = [{wch:6},{wch:12},{wch:8},{wch:16},{wch:18},{wch:12},{wch:12},{wch:16},{wch:10},{wch:12},{wch:8},{wch:30}];
                        XLSX.utils.book_append_sheet(wb, ws, "客户数据");
                        XLSX.writeFile(wb, `客户信息表_${new Date().toISOString().split('T')[0]}.xlsx`);
                        ElMessage.success('Excel 导出成功！');
                    } catch (err) {
                        ElMessage.error('导出失败: ' + (err.message || err));
                    } finally {
                        fullscreenLoading.value = false;
                    }
                };

                const exportData = async () => {
                    if (pagination.total === 0) { ElMessage.warning('当前没有数据可以备份！'); return; }
                    fullscreenLoading.value = true;
                    try {
                        const all = await fetchAll(false);
                        if (all.length === 0) { ElMessage.warning('当前没有数据可以备份！'); return; }
                        const payload = all.map(item => ({
                            country: item.country, countryCode: item.countryCode, time: item.time,
                            company: item.company, clientName: item.clientName, userCode: item.user_code,
                            phone: item.phone, source: item.source, status: item.status, ord: item.ord, remarks: item.remarks
                        }));
                        const blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = `客户数据备份_${new Date().toISOString().split('T')[0]}.json`;
                        a.style.display = 'none';
                        document.body.appendChild(a);
                        a.click();
                        setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); }, 1500);
                        ElMessage.success('数据备份成功！');
                    } catch (err) {
                        ElMessage.error('备份失败: ' + (err.message || err));
                    } finally {
                        fullscreenLoading.value = false;
                    }
                };

                const importData = (file) => {
                    const reader = new FileReader();
                    reader.onload = async (e) => {
                        try {
                            const imported = JSON.parse(e.target.result);
                            if (!Array.isArray(imported) || imported.length === 0) {
                                ElMessage.error('文件格式错误，请选择正确的 JSON 备份文件。');
                                return false;
                            }
                            try {
                                await ElMessageBox.confirm(
                                    `找到 ${imported.length} 条客户数据，确认要导入到云端吗？`,
                                    '数据恢复确认', { confirmButtonText:'确定导入', cancelButtonText:'取消', type:'info' }
                                );
                            } catch { return false; }

                            fullscreenLoading.value = true;
                            const records = imported.map(item => ({
                                user_id: currentUser.value.id,
                                country: item.country||'', country_code: item.countryCode||'',
                                follow_time: item.time||'', company: item.company||'',
                                client_name: item.clientName||'', user_code: item.userCode||'',
                                phone: item.phone||'', source: item.source||'', status: item.status||'潜在客户',
                                ord: item.ord||'', remarks: item.remarks||''
                            }));
                            const { error } = await supabase.from(TABLE_NAME).insert(records);
                            if (error) throw error;
                            ElMessage.success('导入成功！');
                            await refreshData();
                        } catch (err) {
                            ElMessage.error('解析文件失败，请确认文件未被损坏。' + (err.message||''));
                        } finally {
                            fullscreenLoading.value = false;
                        }
                    };
                    reader.readAsText(file);
                    return false;
                };

                // ========== 启动 ==========
                onMounted(async () => {
                    LOG('MOUNT', 'onMounted 触发，准备初始化 Supabase');
                    LOG('MOUNT', 'window 上 supabase 相关全局：', {
                        supabase: typeof window.supabase,
                        supabaseJs: typeof window.supabaseJs,
                        createClient: window.supabase?.createClient ? '有' : '无'
                    });

                    try {
                        // 兼容 UMD 可能不同的全局名
                        const sb = window.supabase || window.supabaseJs;
                        if (sb && sb.createClient) {
                            supabase = sb.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
                                auth: {
                                    persistSession: true,
                                    autoRefreshToken: true,
                                    detectSessionInUrl: false,
                                    storageKey: 'sb-client-auth',
                                    storage: window.localStorage
                                },
                                global: {
                                    fetch: (...args) => fetch(...args)
                                }
                            });
                            LOG('MOUNT', 'Supabase client 创建成功', !!supabase);
                        } else {
                            throw new Error('Supabase SDK 未加载，请检查网络');
                        }
                    } catch(e) {
                        LOG('MOUNT', 'Supabase 初始化异常：', e);
                        console.error('Supabase 初始化失败:', e);
                    }

                    if (!supabase) {
                        setStatus('error', '初始化失败');
                        ElMessage.error('Supabase 初始化失败，请检查网络后刷新页面');
                        clearUser();
                        showAuthPage();
                        LOG('MOUNT', '初始化失败，已弹登录框（兜底）');
                        return;
                    }

                    // 挂载 auth 事件监听
                    // 注意：启动阶段（bootReady=false）onAuthStateChange 可能先于 getSession 触发 SIGNED_IN，
                    // 此时不要在监听器里 await refreshData，否则会与 onMounted 里的 getSession 形成 auth 内部死锁，
                    // 导致 HTTP 请求永远 pending。
                    // 启动流程由下方主动 getSession() 统一驱动。
                    authListener = supabase.auth.onAuthStateChange(async (event, session) => {
                        LOG('AUTH', 'onAuthStateChange event=', event, 'session=', !!session, 'user=', !!session?.user, 'bootReady=', bootReady.value);
                        if (event === 'SIGNED_OUT') {
                            clearUser();
                            showAuthPage();
                            ElMessage.info('已退出登录');
                            return;
                        }
                        if (event === 'TOKEN_REFRESHED' && bootReady.value && session?.user) {
                            applyUser(session.user);
                            // token 自动刷新（如切回标签页触发）：仅静默续期 session，不重复拉数据，避免打断用户操作
                            LOG('AUTH', 'TOKEN_REFRESHED，已应用新 token，不刷新列表');
                            return;
                        }
                        if (event === 'SIGNED_IN') {
                            const prevId = currentUser.value?.id;
                            const newId = session?.user?.id;
                            if (session?.user) applyUser(session.user);
                            // 仅在真正"登录状态发生变化"时才拉数据：
                            // 1) 启动阶段：交给下方 getSession 统一处理，避免 SDK 锁死锁
                            // 2) 启动后：之前未登录 / 切换账号 → 拉数据；同一用户重复 SIGNED_IN（切标签页、token 恢复）→ 不拉
                            if (!bootReady.value) {
                                LOG('AUTH', 'SIGNED_IN during boot, defer refreshData to onMounted getSession');
                                return;
                            }
                            if (prevId && newId && prevId === newId) {
                                LOG('AUTH', 'SIGNED_IN for same user (tab re-focus / token recovery), skip refresh');
                                return;
                            }
                            LOG('AUTH', 'SIGNED_IN new login/account switch, refresh data');
                            try { await refreshData(true); } catch(e) { console.warn(e); }
                            return;
                        }
                    });
                    LOG('MOUNT', 'onAuthStateChange 监听已挂载');

                    window.addEventListener('resize', handleWindowResize);

                    // 主动获取会话（F5 刷新后的唯一启动入口）
                    // 关键：onAuthStateChange 挂载完后立即 await getSession，监听器里启动阶段不再发任何数据请求，
                    // 避免 SDK 内部 auth 锁竞争导致 Promise 永久 pending（表现为 Network 无请求、一直 loading）。
                    let initialSession = null;
                    try {
                        LOG('MOUNT', '调用 supabase.auth.getSession() 获取会话...');
                        const sessionResult = await withTimeout(
                            supabase.auth.getSession(),
                            15000,
                            'supabase.auth.getSession()'
                        );
                        const { data: { session }, error } = sessionResult;
                        LOG('MOUNT', 'getSession 返回 session=', !!session, 'user=', !!session?.user, 'error=', error);
                        if (error) throw error;
                        initialSession = session;
                    } catch (e) {
                        LOG('MOUNT', 'getSession 异常：', e);
                        console.error('getSession 失败:', e);
                        // 兜底：等 500ms 检查 currentUser 是否已被监听器提前设置（启动阶段 SIGNED_IN 可能比 getSession 先到）
                        await new Promise(r => setTimeout(r, 500));
                        if (currentUser.value) {
                            LOG('MOUNT', '兜底：currentUser 已被监听器设置，继续流程');
                            initialSession = { user: currentUser.value };
                        }
                    }

                    // 标记启动完成，之后 onAuthStateChange 中的 SIGNED_IN/TOKEN_REFRESHED 才允许主动发数据查询
                    bootReady.value = true;
                    LOG('MOUNT', 'bootReady = true');

                    if (initialSession && initialSession.user) {
                        applyUser(initialSession.user);
                        LOG('MOUNT', '已 applyUser，开始 refreshData');
                        try {
                            await refreshData(true);
                            LOG('MOUNT', 'refreshData 完成');
                        } catch(e) {
                            LOG('MOUNT', 'refreshData 异常：', e);
                            console.error('首次加载数据失败:', e);
                            ElMessage.error('数据加载失败：' + (e.message || e));
                            setStatus('error', '加载失败');
                            fullscreenLoading.value = false;
                            loadingPage.value = false;
                        }
                    } else {
                        LOG('MOUNT', '无会话，弹登录框');
                        clearUser();
                        showAuthPage();
                    }
                    LOG('MOUNT', 'onMounted 流程结束');
                });

                onBeforeUnmount(() => {
                    if (authListener && authListener.data && authListener.data.subscription) {
                        authListener.data.subscription.unsubscribe();
                    }
                    window.removeEventListener('resize', handleWindowResize);
                    if (mqMobile) {
                        if (mqMobile.removeEventListener) mqMobile.removeEventListener('change', handleWindowResize);
                        else if (mqMobile.removeListener) mqMobile.removeListener(handleWindowResize);
                    }
                });

                return {
                    tableRef,
                    fullscreenLoading, authDialogVisible, authLoading, authError, authForm,
                    currentUser, displayUsername, clientData, pageData, currentFilters, selectedRows,
                    pagination, loadingPage, pageSizes, refreshing,
                    modalVisible, editingId, submitLoading, form,
                    statusText, statusTagType,
                    isMobile, pagerLayout,
                    countryData, sourceList,
                    sourceDialogVisible, sourceFormVisible, sourceEditingId, sourceFormName, sourceOptions, sourceLoading,
                    handleAuth, handleLogout,
                    openModal, showRemarkInfo, submitAddData, updateCountryCode,
                    handleSelectionChange, batchDelete,
                    exportExcel, exportData, importData, refreshData,
                    fetchPage, handleCurrentChange, handleSizeChange, searchUserCode,
                    getCountryClass, indexMethod,
                    openSourceDialog, openSourceForm, submitSourceForm, deleteSourceOption
                };
            }
        });

        app.use(ElementPlus, { locale: ElementPlusLocaleZhCn });
        for (const [key, component] of Object.entries(ElementPlusIconsVue)) {
            app.component(key, component);
        }
        app.mount('#app');
    </script>
</body>
</html>
